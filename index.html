<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --card-bg: #ffffff;
    --bg-soft: #faf9fc;
    --ink: #2e2a3a;
    --ink-soft: #8a8499;
    --line: #ece9f3;
    --accent: #b9a6f0;
    --accent-strong: #9b82e8;
    --r: 22px;
    --shadow: 0 28px 64px -18px rgba(80,60,130,0.20), 0 4px 18px -4px rgba(80,60,130,0.09);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    min-height: 100%;
  }

  /* ─── Card ─── */
  .card {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: min(520px, 92vh);
    background: var(--card-bg);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* Ambient blush */
  .card::before {
    content: '';
    position: absolute;
    top: -90px; right: -90px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(185,166,240,0.12) 0%, transparent 68%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Views ─── */
  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.38s cubic-bezier(0.4,0,0.2,1),
                opacity   0.32s ease;
    will-change: transform, opacity;
  }

  /* Chart: visible by default */
  .v-chart { transform: translateX(0);    opacity: 1; z-index: 1; }
  /* Edit: hidden to the right */
  .v-edit  { transform: translateX(100%); opacity: 0; z-index: 1; }

  /* Toggled */
  .card.editing .v-chart { transform: translateX(-30%); opacity: 0; pointer-events: none; }
  .card.editing .v-edit  { transform: translateX(0);    opacity: 1; }

  /* ─── Chart View ─── */
  .cv-top {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 8px;
    position: relative;
    z-index: 2;
  }

  .cv-top h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.1px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .icon-btn {
    border: none;
    background: var(--bg-soft);
    color: var(--ink-soft);
    width: 36px; height: 36px;
    border-radius: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.16s, color 0.16s, transform 0.14s;
    flex-shrink: 0;
  }
  .icon-btn:hover  { background: #f0ebfc; color: var(--accent-strong); transform: scale(1.06); }
  .icon-btn:active { transform: scale(0.94); }

  .cv-canvas {
    flex: 1;
    min-height: 0;
    position: relative;
    padding: 4px 10px 14px;
  }

  .cv-canvas canvas { width: 100% !important; height: 100% !important; }

  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align: center;
    line-height: 1.65;
    pointer-events: none;
  }
  .empty-state .big { font-size: 34px; }

  /* ─── Edit View ─── */
  .ev-top {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 2;
  }

  .ev-top-left h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ev-top-left p {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 3px;
  }

  /* ─── Rows ─── */
  .rows {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 14px 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .rows::-webkit-scrollbar { width: 4px; }
  .rows::-webkit-scrollbar-track { background: transparent; }
  .rows::-webkit-scrollbar-thumb { background: #e0d8f4; border-radius: 10px; }

  .row {
    display: grid;
    grid-template-columns: 10px 1fr 58px 26px;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 12px;
    transition: background 0.14s ease;
    animation: fadeUp 0.22s ease both;
  }
  .row:hover { background: var(--bg-soft); }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(-5px) scale(0.984); }
    to   { opacity:1; transform:none; }
  }

  .row.out {
    opacity: 0 !important;
    transform: translateX(10px) scale(0.97) !important;
    transition: opacity 0.17s ease, transform 0.17s ease !important;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .name-inp {
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    padding: 5px 7px;
    border-radius: 8px;
    width: 100%;
    min-width: 0;
    font-family: inherit;
    transition: background 0.13s, box-shadow 0.13s;
  }
  .name-inp:hover  { background: #f2eefa; }
  .name-inp:focus  { outline:none; background:#fff; box-shadow: 0 0 0 2px var(--accent); }

  .num-inp {
    width: 58px;
    border: 1.5px solid var(--line);
    background: var(--bg-soft);
    border-radius: 9px;
    text-align: center;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    padding: 6px 4px;
    font-family: inherit;
    -moz-appearance: textfield;
    transition: border-color 0.13s, box-shadow 0.13s, background 0.13s;
  }
  .num-inp::-webkit-outer-spin-button,
  .num-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
  .num-inp:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(185,166,240,0.2); background:#fff; }

  .del-btn {
    border:none; background:transparent;
    color: var(--ink-soft);
    width:26px; height:26px;
    border-radius:7px; cursor:pointer;
    font-size:13px;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.13s;
  }
  .del-btn:hover { background:#fdeaea; color:#d07070; }

  /* ─── Edit footer ─── */
  .ev-ft {
    flex-shrink: 0;
    padding: 8px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .add-btn {
    width: 100%;
    border: 1.5px dashed #d8cdf5;
    background: #faf8ff;
    color: var(--accent-strong);
    font-weight: 600;
    font-size: 12.5px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.13s;
  }
  .add-btn:hover  { background:#f1ecfc; border-color:var(--accent); transform:translateY(-1px); }
  .add-btn:active { transform:none; }

  .reset-btn {
    border: none;
    background: transparent;
    color: #c5bedd;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    align-self: center;
    transition: color 0.13s, background 0.13s;
  }
  .reset-btn:hover { color:var(--ink-soft); background:var(--bg-soft); }

  .ft-note {
    text-align: center;
    font-size: 10px;
    color: #d0c8e4;
  }

  /* ─── Mobile ─── */
  @media (max-width: 480px) {
    body { padding: 10px; align-items: flex-start; }
    .card { height: auto; min-height: min(480px, 88vh); border-radius: 18px; }
    .cv-canvas { min-height: 300px; }
    .row { grid-template-columns: 10px 1fr 52px 24px; gap: 8px; padding: 7px 6px; }
  }
</style>
</head>
<body>
<div class="card" id="card">

  <!-- ── CHART VIEW (default) ── -->
  <div class="view v-chart">
    <div class="cv-top">
      <h1><span>🌱</span> Life Wheel</h1>
      <button class="icon-btn" id="editBtn" title="Edit categories">✏️</button>
    </div>
    <div class="cv-canvas" id="cvCanvas">
      <canvas id="wheelChart"></canvas>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="big">🌱</span>
        Tap ✏️ to add your first category
      </div>
    </div>
  </div>

  <!-- ── EDIT VIEW ── -->
  <div class="view v-edit">
    <div class="ev-top">
      <div class="ev-top-left">
        <h2><span>🌱</span> Edit Wheel</h2>
        <p>Tap a name to rename · change number to update score</p>
      </div>
      <button class="icon-btn" id="closeBtn" title="Back to chart">✕</button>
    </div>
    <div class="rows" id="rows"></div>
    <div class="ev-ft">
      <button class="add-btn"   id="addBtn">+ Add category</button>
      <button class="reset-btn" id="resetBtn">Reset to defaults</button>
      <div class="ft-note">Saved automatically to this browser</div>
    </div>
  </div>

</div>
<script>
(function () {
  /* ── Pastel palette ── */
  const PASTELS = [
    '#A8D8EA','#FFD3B0','#C9E4C5','#F6C9D6','#D8C9F0',
    '#FFE5A8','#B8E0D2','#F4C7C3','#C3D9F0','#E0C9E8',
  ];

  const DEFAULTS = [
    { name:'Health',           value:5 },
    { name:'Career',           value:5 },
    { name:'Relationships',    value:5 },
    { name:'Finances',         value:5 },
    { name:'Personal Growth',  value:5 },
    { name:'Fun & Recreation', value:5 },
  ];

  const STORE = 'lifeWheel_v4';

  /* ── State ── */
  let cats  = [];
  let chart = null;
  let _id   = 0;

  const uid   = () => '_' + (_id++) + Math.random().toString(36).slice(2,5);
  const clamp = v  => { v=Number(v); return isNaN(v)?0:Math.min(10,Math.max(0,v)); };
  const col   = i  => PASTELS[i % PASTELS.length];
  const rgba  = (h,a) => {
    const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };

  /* ── Dynamic per-edge padding so labels never clip ──
     For each label at angular position θ (measured from top, clockwise):
     - cos θ > 0  → label is on the right half  → needs right-edge clearance
     - cos θ < 0  → label is on the left half   → needs left-edge clearance
     - sin θ > 0  → label is on the bottom half → needs bottom clearance
     - sin θ < 0  → label is on the top half    → needs top clearance          */
  function labelPad() {
    const n = cats.length;
    if (!n) return { top:28, right:28, bottom:28, left:28 };

    const CW   = 6.5;  // ~px per char at 11px Inter
    const LH   = 18;   // label line-height px
    const BASE = 20;   // minimum per-edge padding

    let T=BASE, R=BASE, B=BASE, L=BASE;

    cats.forEach((cat, i) => {
      const θ   = (2*Math.PI*i/n) - Math.PI/2;
      const cos = Math.cos(θ), sin = Math.sin(θ);
      const hw  = Math.max(16, (cat.name||'x').length * CW / 2);

      R = Math.max(R, BASE + hw*Math.max(0, cos)  + LH*0.5*Math.abs(sin)*0.35);
      L = Math.max(L, BASE + hw*Math.max(0,-cos)  + LH*0.5*Math.abs(sin)*0.35);
      B = Math.max(B, BASE + LH*Math.max(0, sin)  + hw*Math.abs(cos)*0.22);
      T = Math.max(T, BASE + LH*Math.max(0,-sin)  + hw*Math.abs(cos)*0.22);
    });

    return {
      top:    Math.ceil(T)+6,
      right:  Math.ceil(R)+6,
      bottom: Math.ceil(B)+6,
      left:   Math.ceil(L)+6,
    };
  }

  /* ── Chart ── */
  function buildChart() {
    const ctx = document.getElementById('wheelChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'radar',
      data: buildData(),
      options: buildOpts(),
    });
  }

  function buildData() {
    return {
      labels: cats.map(c => c.name || ' '),
      datasets: [{
        data: cats.map(c => c.value),
        backgroundColor: rgba('#C9C2EE', 0.24),
        borderColor: '#B6A6E8',
        borderWidth: 2.5,
        pointBackgroundColor: cats.map((_,i) => col(i)),
        pointBorderColor: '#fff',
        pointBorderWidth: 2.5,
        pointRadius: 5.5,
        pointHoverRadius: 7.5,
        fill: true,
      }],
    };
  }

  function buildOpts() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration:400, easing:'easeOutQuart' },
      layout: { padding: labelPad() },
      plugins: { legend:{ display:false }, tooltip:{ enabled:true } },
      scales: {
        r: {
          min:0, max:10,
          ticks: {
            stepSize:2,
            backdropColor:'transparent',
            color:'#c5bedd',
            font:{ size:8 },
          },
          grid:        { color:'#ece9f3' },
          angleLines:  { color:'#ece9f3' },
          pointLabels: {
            color:'#5c5570',
            font:{ size:11, family:"'Inter',sans-serif", weight:'600' },
          },
        },
      },
    };
  }

  function refreshChart() {
    if (!chart) return;
    chart.options.layout.padding = labelPad();
    chart.data.labels = cats.map(c => c.name || ' ');
    chart.data.datasets[0].data = cats.map(c => c.value);
    chart.data.datasets[0].pointBackgroundColor = cats.map((_,i) => col(i));
    chart.update();

    const empty  = document.getElementById('emptyState');
    const canvas = document.getElementById('wheelChart');
    empty.style.display  = cats.length ? 'none'  : 'flex';
    canvas.style.display = cats.length ? 'block' : 'none';
  }

  /* ── Rows ── */
  function renderRows() {
    const el = document.getElementById('rows');
    el.innerHTML = '';

    cats.forEach((cat, idx) => {
      const row = document.createElement('div');
      row.className = 'row';

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = col(idx);

      const name = document.createElement('input');
      name.className = 'name-inp';
      name.type = 'text';
      name.value = cat.name;
      name.placeholder = 'Category name';
      name.maxLength = 30;
      name.addEventListener('input', () => { cat.name=name.value; save(); refreshChart(); });
      name.addEventListener('blur',  () => {
        if (!name.value.trim()) { name.value=cat.name='Untitled'; save(); refreshChart(); }
      });
      name.addEventListener('keydown', e => { if(e.key==='Enter') name.blur(); });

      const num = document.createElement('input');
      num.className = 'num-inp';
      num.type='number'; num.min=0; num.max=10; num.step=1; num.value=cat.value;
      num.addEventListener('input', () => { cat.value=clamp(num.value); save(); refreshChart(); });
      num.addEventListener('blur',  () => { num.value=cat.value; });

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.innerHTML = '✕';
      del.title = 'Remove';
      del.addEventListener('click', () => {
        row.classList.add('out');
        setTimeout(() => { cats=cats.filter(c=>c!==cat); save(); renderRows(); refreshChart(); }, 175);
      });

      row.append(dot, name, num, del);
      el.appendChild(row);
    });
  }

  /* ── Persistence ── */
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cats)); } catch(e){} };

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) {
        const p = JSON.parse(raw);
        if (Array.isArray(p)) {
          cats = p.map(c=>({ id:c.id||uid(), name:String(c.name||''), value:clamp(c.value) }));
          return;
        }
      }
    } catch(e) {}
    cats = DEFAULTS.map(d=>({ id:uid(), name:d.name, value:d.value }));
  }

  /* ── Actions ── */
  function addCat() {
    cats.push({ id:uid(), name:'New Category', value:5 });
    save(); renderRows(); refreshChart();
    const all = document.querySelectorAll('#rows .row');
    const last = all[all.length-1];
    if (last) {
      last.scrollIntoView({ behavior:'smooth', block:'nearest' });
      const inp = last.querySelector('.name-inp');
      setTimeout(() => { if(inp){ inp.focus(); inp.select(); } }, 60);
    }
  }

  function reset() {
    cats = DEFAULTS.map(d=>({ id:uid(), name:d.name, value:d.value }));
    save(); renderRows(); refreshChart();
  }

  /* ── View toggle ── */
  const card = document.getElementById('card');
  document.getElementById('editBtn').addEventListener('click',  () => card.classList.add('editing'));
  document.getElementById('closeBtn').addEventListener('click', () => card.classList.remove('editing'));
  document.getElementById('addBtn').addEventListener('click', addCat);
  document.getElementById('resetBtn').addEventListener('click', reset);

  /* ── Boot ── */
  load();
  buildChart();
  renderRows();
  refreshChart();
})();
</script>
</body>
</html>
